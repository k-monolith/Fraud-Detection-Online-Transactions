apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: fraud
    secureJsonData:
      password: fraud
    jsonData:
      database: fraud
      sslmode: disable
      postgresVersion: 1700
