# Prometheus configuration: scrapes Flink, the model-behavior exporter and itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: flink-jobmanager
    static_configs: [{ targets: ["jobmanager:9249"] }]
  - job_name: flink-taskmanager
    static_configs: [{ targets: ["taskmanager:9249"] }]
  - job_name: model-exporter
    static_configs: [{ targets: ["metrics-exporter:8000"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
